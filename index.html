<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Website</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
    <script>
        // light/dark from the moon phase: new moon (0°) = dark, full moon (180°) = light
        const LIGHT = { bg:[243,233,198], card:[251,245,222], frame:[255,255,255], accent:[183,75,75], pre:[246,246,246], mv:[236,228,196] };
        const DARK  = { bg:[28,26,22],    card:[42,39,33],    frame:[51,48,42],    accent:[224,118,107], pre:[32,30,25],   mv:[58,54,46] };

        function applyPhase(a) {
            const t = (1 - Math.cos(a * Math.PI / 180)) / 2;   // 0 = new moon, 1 = full moon
            const s = document.documentElement.style;
            for (const k in LIGHT) {
                const c = LIGHT[k].map((v, i) => Math.round(DARK[k][i] + (v - DARK[k][i]) * t));
                s.setProperty('--' + k, 'rgb(' + c.join(',') + ')');
            }
            s.setProperty('--text', t > 0.45 ? '#000000' : '#f3e9c6');   // flips so text stays readable
        }

        let moonStart = 180;   // default: full moon = light mode
        try { const v = parseFloat(localStorage.getItem('moonAngle')); if (!isNaN(v)) moonStart = v; } catch (e) {}
        applyPhase(moonStart);
    </script>
</head>
<body>
    <div id="theme" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="360"
         aria-label="Drag the moon around the Earth to change light and dark mode">
        <img class="sun" src="darkmode/sun.png" alt="" draggable="false">
        <div class="orbit"></div>
        <img class="earth" src="darkmode/earth.png" alt="" draggable="false">
        <div class="moon" id="moon">
            <img src="darkmode/moon.png" alt="" draggable="false">
            <svg viewBox="0 0 100 100"><path id="shade" fill-rule="evenodd" fill="#000" fill-opacity="0.85"/></svg>
        </div>
    </div>

    <a href="#" class="title" id="home">My Portfolio Times</a>

    <nav>
        <div class="author">by Nikolaos Avgoustatos</div>

        <div class="columns">
            <section class="col geology">
                <h3>Geology</h3>
                <div class="item">
                    <a href="#" data-folder="geochemicalmapping">Geochemical Mapping</a>
                    <div class="preview" data-folder="geochemicalmapping"></div>
                </div>
                <div class="item">
                    <a href="#" data-folder="R">Geostatistics with R</a>
                    <div class="preview" data-folder="R"></div>
                </div>
                <div class="item">
                    <a href="#" data-folder="LaTeX projects">LaTeX Template</a>
                    <div class="preview" data-folder="LaTeX projects"></div>
                </div>
            </section>

            <section class="col creativity">
                <h3>Creativity</h3>
                <a href="#" data-folder="lightnovels">Light Novels</a>
                <a href="#" data-folder="music">Music</a>
                <a href="#" data-folder="digitalpainting">Digital Painting</a>
                <a href="#" data-folder="3dassetmaking">3D Assets</a>
                <a href="#" data-folder="animation">Animations</a>
                <a href="#" data-folder="videogames">Video Games</a>
            </section>
        </div>
    </nav>

    <main class="gallery" id="gallery"></main>

    <script>
        // ===== PUT YOUR PATHS HERE =====
        // Paths are relative to the folder: "animechar1/hips.glb" means
        // assets/3dassetmaking/animechar1/hips.glb
        const FILES = {
            "geochemicalmapping": [
                "As_map.png",
                "finallocations.png"
            ],
            "LaTeX projects": [],
            "R": [],
            "lightnovels": [],
            "music": [
                "The Legend of the Samurai.mp3"
            ],
            "digitalpainting": [
                "maudpie.png",
                "maudpie.png",
                "maudpie.png",
                "maudpie.png"
            ],
            "3dassetmaking": [
                "animechar1/hips.glb"
            ],
            "animation": [],
            "videogames": []
        };
        // ================================

        const gallery = document.getElementById('gallery');
        const links = document.querySelectorAll('nav a[data-folder]');
        let openCard = null;

        const EXT = {
            image: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'avif'],
            video: ['mp4', 'webm', 'ogv', 'mov'],
            audio: ['mp3', 'wav', 'ogg', 'flac', 'm4a'],
            midi:  ['mid', 'midi'],
            model: ['glb', 'gltf'],
            pdf:   ['pdf'],
            text:  ['cpp', 'c', 'h', 'hpp', 'py', 'r', 'rmd', 'tex', 'sty', 'cls', 'bib',
                    'txt', 'md', 'js', 'json', 'csv', 'cs', 'gd', 'html', 'css']
        };

        const extOf = n => n.split('.').pop().toLowerCase();
        function typeOf(name) {
            const ext = extOf(name);
            for (const t in EXT) if (EXT[t].includes(ext)) return t;
            return 'other';
        }
        const isSong = name => ['audio', 'midi'].includes(typeOf(name));
        const url = p => p.split('/').map(encodeURIComponent).join('/');

        function el(tag, attrs = {}, children = []) {
            const e = document.createElement(tag);
            for (const k in attrs) {
                if (k === 'text') e.textContent = attrs[k];
                else e.setAttribute(k, attrs[k]);
            }
            [].concat(children).forEach(c => e.append(c));
            return e;
        }

        const downloadLink = (path, label) =>
            el('a', { href: url(path), download: '', class: 'dl', text: label || 'Download' });

        // ---------- moon phase = light / dark ----------
        const phase = document.getElementById('theme');
        const moon = document.getElementById('moon');
        const shade = document.getElementById('shade');
        const earthEl = phase.querySelector('.earth');
        let angle = moonStart;   // 0 = new moon (towards the Sun), 180 = full moon

        function setAngle(a, save) {
            angle = ((a % 360) + 360) % 360;
            const rad = angle * Math.PI / 180;
            moon.style.left = (6 + 4.2 * Math.cos(rad) - 1.1) + 'rem';
            moon.style.top  = (6 - 4.2 * Math.sin(rad) - 1.1) + 'rem';

            // phase shading as seen from Earth: waxing is lit on the right, waning on the left
            const c = Math.cos(rad), rx = 50 * Math.abs(c), waxing = angle < 180;
            const sweep = waxing ? (c > 0 ? 0 : 1) : (c > 0 ? 1 : 0);
            const litHalf = waxing ? 'M50,0 A50,50 0 0 1 50,100' : 'M50,0 A50,50 0 0 0 50,100';
            shade.setAttribute('d', 'M50,0 A50,50 0 1 1 50,100 A50,50 0 1 1 50,0 Z ' +
                litHalf + ' A' + rx + ',50 0 0 ' + sweep + ' 50,0 Z');

            applyPhase(angle);
            phase.setAttribute('aria-valuenow', Math.round(angle));
            if (save) { try { localStorage.setItem('moonAngle', angle); } catch (e) {} }
        }

        function pointerAngle(e) {
            const r = earthEl.getBoundingClientRect();
            return Math.atan2(-(e.clientY - (r.top + r.height / 2)), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
        }

        let dragging = false;
        phase.addEventListener('pointerdown', e => {
            dragging = true;
            phase.setPointerCapture(e.pointerId);
            setAngle(pointerAngle(e), false);
        });
        phase.addEventListener('pointermove', e => { if (dragging) setAngle(pointerAngle(e), false); });
        const stopDrag = () => { if (dragging) { dragging = false; setAngle(angle, true); } };
        phase.addEventListener('pointerup', stopDrag);
        phase.addEventListener('pointercancel', stopDrag);
        phase.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setAngle(angle + 10, true); }
            if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setAngle(angle - 10, true); }
        });

        setAngle(angle, false);

        function buildContent(path) {
            const name = path.split('/').pop();
            const src = url(path);

            switch (typeOf(name)) {
                case 'image':
                    return el('img', { src, alt: name, loading: 'lazy' });

                case 'video':
                    return el('video', { src, controls: '', preload: 'metadata' });

                case 'audio':
                    return el('audio', { src, controls: '', preload: 'none' });

                case 'midi': {
                    const wrap = el('div', { class: 'midi' });
                    const player = document.createElement('midi-player');
                    player.setAttribute('src', src);
                    player.setAttribute('sound-font', '');
                    wrap.append(player);
                    return wrap;
                }

                case 'model': {
                    const mv = document.createElement('model-viewer');
                    mv.setAttribute('src', src);
                    mv.setAttribute('camera-controls', '');
                    mv.setAttribute('auto-rotate', '');
                    mv.setAttribute('loading', 'eager');
                    mv.setAttribute('reveal', 'auto');
                    mv.setAttribute('environment-image', 'neutral');
                    mv.setAttribute('shadow-intensity', '1');
                    mv.setAttribute('touch-action', 'pan-y');
                    mv.setAttribute('alt', name);

                    mv.addEventListener('error', async ev => {
                        let msg;
                        try {
                            const r = await fetch(src);
                            if (!r.ok) {
                                msg = 'File not found (HTTP ' + r.status + '): ' + decodeURIComponent(src) +
                                    '. Check the folder and file name, including capital letters.';
                            } else {
                                const head = new Uint8Array((await r.arrayBuffer()).slice(0, 4));
                                const magic = String.fromCharCode(...head);
                                if (magic !== 'glTF') {
                                    msg = 'This is not a real .glb file (it starts with "' + magic + '"). ' +
                                        'In Blender use File > Export > glTF 2.0 and choose Format: glTF Binary (.glb). ' +
                                        'Renaming a .blend to .glb does not work.';
                                } else {
                                    const detail = ev.detail && ev.detail.sourceError ? ev.detail.sourceError.message : 'unknown error';
                                    msg = 'The file was found but could not be read: ' + detail;
                                }
                            }
                        } catch (err) {
                            msg = 'Cannot read files here. Open the site through Live Server (http://...), not by double-clicking index.html.';
                        }
                        mv.replaceWith(el('div', { class: 'note', text: msg }));
                    });
                    return mv;
                }

                case 'pdf':
                    return el('embed', { src, type: 'application/pdf' });

                case 'text': {
                    const pre = el('pre');
                    const d = el('details', {}, [el('summary', { text: 'View file' }), pre]);
                    d.addEventListener('toggle', () => {
                        if (d.open && !pre.textContent) {
                            pre.textContent = 'Loading...';
                            fetch(src).then(r => r.text()).then(t => pre.textContent = t)
                                .catch(() => pre.textContent = 'Could not load file.');
                        }
                    });
                    return el('div', { class: 'textwrap' }, [d, downloadLink(path)]);
                }

                default:
                    return downloadLink(path, extOf(name) === 'blend' ? 'Download .blend' : 'Download');
            }
        }

        // ---------- default view: first item of each Geology folder ----------
        function renderPreviews() {
            document.querySelectorAll('.preview').forEach(p => {
                const folder = p.dataset.folder;
                const first = (FILES[folder] || [])[0];
                p.innerHTML = '';
                if (first) p.append(buildContent('assets/' + folder + '/' + first));
                else p.append(el('div', { class: 'note', text: 'Coming soon' }));
            });
        }
        renderPreviews();

        function render(folder) {
            openCard = null;
            gallery.innerHTML = '';
            const files = FILES[folder] || [];

            if (!files.length) {
                gallery.append(el('p', { class: 'empty', text: 'No files in this folder yet.' }));
                return;
            }

            // group by subfolder (paths are relative to the folder)
            const groups = {};
            files.forEach(rel => {
                const parts = rel.split('/');
                parts.pop();
                const key = parts.join(' / ');
                (groups[key] = groups[key] || []).push(rel);
            });

            Object.keys(groups).sort().forEach(key => {
                const section = el('section', { class: 'subgroup' });
                if (key) section.append(el('h2', { text: key }));

                const allSongs = groups[key].every(rel => isSong(rel));
                const grid = el('div', { class: 'grid' + (allSongs ? ' inline' : '') });

                groups[key].forEach(rel => {
                    const full = 'assets/' + folder + '/' + rel;
                    const name = rel.split('/').pop();
                    const parts = [el('div', { class: 'frame' }, buildContent(full))];

                    if (isSong(name)) {
                        parts.push(el('div', { class: 'songtitle', text: name.replace(/\.[^.]+$/, '') }));
                    }

                    grid.append(el('figure', { class: 'card ' + typeOf(name) }, parts));
                });

                section.append(grid);
                gallery.append(section);
            });
        }

        // ---------- image expand / collapse (FLIP animation) ----------
        function setOpen(card) {
            const cards = [...gallery.querySelectorAll('.card')];
            const first = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
            const prev = openCard;

            if (openCard) openCard.classList.remove('open');
            openCard = card;
            if (card) card.classList.add('open');

            cards.forEach(c => {
                const f = first.get(c);
                const l = c.getBoundingClientRect();
                const dx = f.left - l.left;
                const dy = f.top - l.top;
                const sx = f.width / l.width;
                const sy = f.height / l.height;
                if (!dx && !dy && sx === 1 && sy === 1) return;

                c.animate([
                    { transformOrigin: 'top left', transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` },
                    { transformOrigin: 'top left', transform: 'none' }
                ], { duration: 450, easing: 'cubic-bezier(.2, .8, .2, 1)' });
            });

            // centre the opened image (or the one just closed) so it never sticks to the top/bottom
            const target = card || prev;
            if (target) {
                setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 460);
            }
        }

        document.addEventListener('click', e => {
            if (e.target.closest('nav') || e.target.closest('#theme')) return;
            const card = e.target.closest('.card.image');
            if (card && gallery.contains(card)) {
                setOpen(card === openCard ? null : card);
            } else if (openCard) {
                setOpen(null);
            }
        });

        // clicking the title returns to the default view
        document.getElementById('home').addEventListener('click', e => {
            e.preventDefault();
            links.forEach(l => l.classList.remove('active'));
            gallery.classList.remove('show');
            gallery.innerHTML = '';
            openCard = null;
            document.body.classList.remove('browsing');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        links.forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const wasActive = a.classList.contains('active');
                links.forEach(l => l.classList.remove('active'));
                gallery.classList.remove('show');
                openCard = null;
                document.body.classList.toggle('browsing', !wasActive); // hides the default previews
                if (wasActive) return;
                a.classList.add('active');
                gallery.classList.add('show');   // show first so 3D viewers can measure their size
                render(a.dataset.folder);
            });
        });
    </script>
</body>
</html>
